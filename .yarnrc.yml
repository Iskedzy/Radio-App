# Nuxt belum kompatibel penuh dengan Yarn Plug'n'Play.
# Bin `nuxt` (nuxi) melakukan dynamic import("@nuxt/kit") yang tidak bisa
# di-resolve oleh PnP, sehingga dev server gagal start dengan:
#   ERROR Cannot resolve module "@nuxt/kit"
# Pakai linker node_modules agar semua dependency bisa diresolve normal.
nodeLinker: node-modules
